services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=development
      - JWT_SECRET_KEY=dev-secret-key-change-in-production-demo-only
      - JWT_EXPIRE_MINUTES=240
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:5173
      - DATA_FILE_PATH=/app/data/store.json
    volumes:
      # Mount local data folder to persist JSON file across container restarts
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: quiz-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
